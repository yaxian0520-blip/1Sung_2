<style>
:root{--bg:#fff2b8;--sf:#fffbe6;--ink:#17202b;--mu:#6f6538;--ln:#e6d68a;--ac:#2f5fe3;--on:#fff;--red:#d64560;--c0:#2f5fe3;--c1:#12a37f;--c2:#e8912d;--c3:#d64560;--c4:#8a5cf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--sf:#171e28;--ink:#e8edf4;--mu:#8d99a9;--ln:#263041;--ac:#7096ff;--on:#0f141b;--red:#ff7b92;--c0:#7096ff;--c1:#2fc9a2;--c2:#f2a850;--c3:#ff7b92;--c4:#a98bff}}
:root[data-theme="dark"]{--bg:#0f141b;--sf:#171e28;--ink:#e8edf4;--mu:#8d99a9;--ln:#263041;--ac:#7096ff;--on:#0f141b;--red:#ff7b92;--c0:#7096ff;--c1:#2fc9a2;--c2:#f2a850;--c3:#ff7b92;--c4:#a98bff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "이서윤체","Lee Seoyun","LeeSeoyun","산돌 이서윤체","Gamja Flower","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;font-synthesis:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;position:relative;max-width:560px;margin:0 auto;background:var(--bg)}
header{padding:12px 12px 6px}
.top{display:flex;align-items:center;gap:4px}
.top h1{flex:1;margin:0;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.01em}
.nav{width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;color:var(--mu)}
#today{height:32px;padding:0 12px;border:1px solid var(--ln);border-radius:16px;font-size:15px;font-weight:500;background:var(--sf)}
#sub{text-align:center;color:var(--mu);font-size:14px;height:16px;margin-top:-4px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 96px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:14px;color:var(--mu);padding:6px 0}
.dow span:first-child{color:var(--red)}
.day{display:flex;flex-direction:column;align-items:center;padding:5px 0 6px;min-height:58px;border-radius:10px}
.num{width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;font-weight:500}
.grid .day:nth-child(7n+1) .num{color:var(--red)}
.grid .day:nth-child(7n) .num{color:var(--ac)}
.day.sel .num{outline:1.5px solid var(--ac);outline-offset:2px}
.day.today .num{background:var(--ac);color:var(--on);font-weight:700}
.dots{display:flex;gap:3px;height:6px;margin-top:5px}
.dots i{width:6px;height:6px;border-radius:50%}
.sec{margin-top:18px}
.sec h2{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:16px;font-weight:700;color:var(--mu)}
.mk{height:30px;width:auto;flex:none}
.sec.now h2{color:var(--ac)}
.em{margin:8px 0;color:var(--mu);font-size:16px}

  const r=e.r;

    const kk=ymd(add(fromY(k),-o));

function weekSegs(cells){

      const en=ymd(add(fromY(s),L));

function clearBg(x,w,h){

  const push=i=>{if(!seen[i]&&a[i*4]>235&&a[i*4+1]>235&&a[i*4+2]>235&&a[i*4+3]>0){seen[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}
  for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const i=st.pop(),c=i%w;a[i*4+3]=0;if(c>0)push(i-1);if(c<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*(h-1))push(i+w)}

function procImg(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const r=Math.min(1,128/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d',{willReadFrequently:true});
        x.drawImage(im,0,0,w,h);
        try{clearBg(x,w,h)}catch(e){}
        res(c.toDataURL('image/png'));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

$('#bgs').onclick=e=>{const b=e.target.closest('.sw[data-b]');if(b){BG=b.dataset.b==='def'?'':b.dataset.b;saveBg();applyBg(BG);paintBg()}};
$('#bgs').addEventListener('input',e=>{if(e.target.id!=='bg-pick')return;BG=e.target.value.toLowerCase();saveBg();applyBg(BG)});
$('#bgs').addEventListener('change',e=>{if(e.target.id==='bg-pick')paintBg()});
let FSEL='seo';
try{FSEL=localStorage.getItem('sched.font')||'seo'}catch(e){}
const FB=",'Gamja Flower','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const fcss=id=>(FN.find(f=>f[0]===id)||FN[0])[2]+FB;
const applyFont=()=>{document.body.style.fontFamily=fcss(FSEL)};
function paintFl(){$('#fl').innerHTML=FN.map(f=>`<button type="button" data-f="${f[0]}" aria-pressed="${FSEL===f[0]}" style="font-family:${f[2]}${FB}">${f[1]}<span>10월 23일 금요일</span></button>`).join('')}
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;FSEL=b.dataset.f;try{localStorage.setItem('sched.font',FSEL)}catch(err){}applyFont();paintFl()};
applyBg(BG);
applyFont();
paintIc();
render();
</script>
